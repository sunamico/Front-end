<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="Савченко, ІО-44, Лабораторна 3, HTML5, CSS3, float, flex">
    <meta name="description" content="Лабораторна робота №3 студентки Савченко Р. В., група ІО-44">
    <title>Савченко Руслана Володимирівна, група-ІО-44, номер лаб. роботи-3, номер варіанта-10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Лабораторна робота №3 (Варіант 10)</h1>

    <section class="task-section">
        <h2>Завдання 1. Верстка макету за допомогою Float</h2>
        
        <div class="layout-float clearfix">
            <div class="top-row clearfix">
                <div class="block green-bg float-green">IMG</div>
       
                <div class="right-col float-right-col">
                    <div class="block blue-bg">TEXT</div>
                    <div class="block yellow-bg">TEXT</div>
                </div>
            </div>

            <div class="bottom-row clearfix">
                <div class="block beige-bg float-beige">TEXT</div>
                <div class="block purple-bg float-purple">IMG</div>
            </div>
        </div>
    </section>


    <!-- ==========================================
         ЗАВДАННЯ 2: Верстка макету за допомогою Flexbox
    =========================================== -->
    <section class="task-section">
        <h2>Завдання 2. Верстка макету за допомогою Flexbox</h2>
        
        <div class="layout-flex">
            <div class="flex-top-row">
                <div class="block green-bg flex-green">IMG</div>
                
                <div class="flex-right-col">
                    <div class="block blue-bg flex-blue">TEXT</div>
                    <div class="block yellow-bg flex-yellow">TEXT</div>
                </div>
            </div>

            <div class="flex-bottom-row">
                <div class="block beige-bg flex-beige">TEXT</div>
                <div class="block purple-bg flex-purple">IMG</div>
            </div>
        </div>
    </section>

</body>
</html>
